version: '3.8'

services:
  app:
    build: .
    container_name: dld_mfa_app
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:DldSecurePass2026@db:5432/dld_mfa
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=DLD_SECRET_PRODUCTION_KEY_32_BYTES_LONG
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: dld_mfa_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DldSecurePass2026
      POSTGRES_DB: dld_mfa
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dld_mfa_redis
    restart: always
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: